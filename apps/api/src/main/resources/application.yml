spring:
  application:
    name: codepath-academy-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/codepath_academy}
    username: ${DATABASE_USERNAME:codepath}
    password: ${DATABASE_PASSWORD:codepath_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
      timeout: ${SESSION_TIMEOUT:8h}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
