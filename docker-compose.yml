services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codepath_academy
      POSTGRES_USER: codepath
      POSTGRES_PASSWORD: codepath_dev_only
    ports:
      - "5432:5432"
    volumes:
      - codepath-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepath -d codepath_academy"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/codepath_academy
      DATABASE_USERNAME: codepath
      DATABASE_PASSWORD: codepath_dev_only
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  web:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  codepath-postgres:
